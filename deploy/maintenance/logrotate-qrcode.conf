# Rotasi log aplikasi SI penelitian QR Code RSA-PSS.
#
# Hanya berkas *.log yang dirotasi. Berkas CSV di logs/ sengaja tidak disentuh:
# log_generate.csv dan log_verifikasi.csv adalah sumber data metrik dashboard,
# bukan log teknis, dan merotasinya akan memotong jendela pengukuran.

/opt/qrcode/logs/*.log {
    weekly
    rotate 8
    size 20M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}

/var/log/qrcode-*.log {
    monthly
    rotate 6
    compress
    missingok
    notifempty
    create 0640 root root
    su root syslog
}
