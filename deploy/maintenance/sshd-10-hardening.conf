# Hardening SSH — SI penelitian QR Code RSA-PSS
#
# Bernomor 10 agar dibaca paling awal: pada sshd, nilai PERTAMA yang diperoleh
# untuk sebuah kata kunci adalah yang berlaku, bukan yang terakhir. Drop-in
# bernomor lebih besar (50-cloud-init, 60-cloudimg) karenanya tidak dapat
# menimpa berkas ini.
#
# Latar: btmp mencatat 24.275 percobaan login gagal, 4.702 di antaranya
# menyasar root — porsi terbesar dari seluruh sasaran.

# Tutup akses root sepenuhnya. Administrasi tetap dapat dilakukan melalui user
# amikom yang memiliki entri sudoers eksplisit (amikom ALL=(ALL) NOPASSWD:ALL),
# sehingga tidak bergantung pada keanggotaan grup dan tetap berlaku setelah
# perubahan ini.
PermitRootLogin no

# PasswordAuthentication SENGAJA dibiarkan aktif (diatur 50-cloud-init.conf).
# Pemilik server mengelola sistem dari lebih dari satu perangkat, sehingga
# mematikannya sekarang akan mengunci akses dari mesin yang belum memegang
# kunci. Langkah tersebut ditunda sampai kunci publik terpasang pada seluruh
# perangkat yang dipakai.
#
# Sebagai kompensasi selama masa transisi: ufw membatasi laju koneksi port 22,
# dan fail2ban memblokir sumber yang gagal tiga kali dalam sepuluh menit.

# Perketat percobaan autentikasi per koneksi (bawaan 6).
MaxAuthTries 3

# Putus koneksi yang menganggur sebelum autentikasi selesai. Dinaikkan dari 30
# ke 60 detik: 30 detik terlalu sempit untuk tautan rumah, sedangkan pagar utama
# terhadap percobaan paksa tetap MaxAuthTries dan fail2ban, bukan angka ini.
LoginGraceTime 60

# ── Deteksi koneksi mati (keepalive tingkat SSH) ───────────────────────────
#
# Bawaan ClientAliveInterval adalah 0, artinya server tidak pernah menyapa
# client. Sesi yang menganggur karenanya mati diam-diam ketika NAT di sisi
# client membuang pemetaannya, dan aplikasi non-interaktif (mis. Claude Code)
# baru menyadarinya saat mengirim perintah berikutnya lalu reconnect berulang.
#
# Dengan probe tiap 60 detik, sesi menganggur tetap hidup di NAT, dan sesi yang
# benar-benar putus dikenali dalam 3 menit (60 x 3) alih-alih menggantung.
ClientAliveInterval 60
ClientAliveCountMax 3

# ── Autentikasi dua faktor (TOTP, RFC 6238) ────────────────────────────────
#
# SEMENTARA DINONAKTIFKAN: login SSH cukup memakai public key atau password.
# Untuk mengaktifkan TOTP lagi, kembalikan PasswordAuthentication=no,
# KbdInteractiveAuthentication=yes, AuthenticationMethods="publickey
# keyboard-interactive", dan aktifkan lagi pam_google_authenticator di
# /etc/pam.d/sshd.
PasswordAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes

# Kunci publik tetap diterima; password dipakai sebagai fallback sementara.
AuthenticationMethods publickey password
