# Hardening SSH — SI penelitian QR Code RSA-PSS
#
# Bernomor 10 agar dibaca paling awal: pada sshd, nilai PERTAMA yang diperoleh
# untuk sebuah kata kunci adalah yang berlaku, bukan yang terakhir. Drop-in
# bernomor lebih besar (50-cloud-init, 60-cloudimg) karenanya tidak dapat
# menimpa berkas ini.
#
# Latar: btmp mencatat 24.275 percobaan login gagal, 4.702 di antaranya
# menyasar root — porsi terbesar dari seluruh sasaran.

# Tutup akses root sepenuhnya. Administrasi tetap dapat dilakukan melalui user
# amikom yang memiliki entri sudoers eksplisit (amikom ALL=(ALL) NOPASSWD:ALL),
# sehingga tidak bergantung pada keanggotaan grup dan tetap berlaku setelah
# perubahan ini.
PermitRootLogin no

# PasswordAuthentication SENGAJA dibiarkan aktif (diatur 50-cloud-init.conf).
# Pemilik server mengelola sistem dari lebih dari satu perangkat, sehingga
# mematikannya sekarang akan mengunci akses dari mesin yang belum memegang
# kunci. Langkah tersebut ditunda sampai kunci publik terpasang pada seluruh
# perangkat yang dipakai.
#
# Sebagai kompensasi selama masa transisi: ufw membatasi laju koneksi port 22,
# dan fail2ban memblokir sumber yang gagal tiga kali dalam sepuluh menit.

# Perketat percobaan autentikasi per koneksi (bawaan 6).
MaxAuthTries 3

# Putus koneksi yang menganggur sebelum autentikasi selesai.
LoginGraceTime 30

# ── Autentikasi dua faktor (TOTP, RFC 6238) ────────────────────────────────
#
# PasswordAuthentication dimatikan, TETAPI login dengan password tetap berfungsi.
# Yang ditutup adalah jalur password internal sshd; autentikasi dialihkan ke PAM
# lewat keyboard-interactive, dan PAM tetap menanyakan password Unix sebelum
# meminta kode TOTP.
#
# Penutupan jalur internal itu WAJIB. Bila dibiarkan aktif, penyerang dapat
# melewati TOTP sepenuhnya hanya dengan menebak password.
#
# Faktor kedua berada di ponsel, bukan di mesin yang dipakai menyambung —
# dipilih justru karena pemilik mengelola server dari banyak perangkat.
PasswordAuthentication no
KbdInteractiveAuthentication yes
UsePAM yes

# Kunci publik diterima sebagai alternatif berdiri sendiri; kunci sudah
# merupakan faktor kuat. Menyiapkan jalur untuk kemudian hari.
AuthenticationMethods publickey keyboard-interactive
