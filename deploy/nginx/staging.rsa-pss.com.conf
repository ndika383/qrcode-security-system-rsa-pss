# Vhost staging SI penelitian QR Code RSA-PSS.
#
# Meneruskan ke instans terpisah pada port 5001 dengan direktori kerja
# /opt/qrcode-staging, sehingga basis data, ledger nonce, dan kunci
# penandatangan sepenuhnya terpisah dari produksi.

server {
    if ($host = staging.rsa-pss.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name staging.rsa-pss.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.rsa-pss.com;

    client_max_body_size 500M;
    large_client_header_buffers 4 64k;

    # Penanda lingkungan agar tidak keliru dianggap produksi, baik oleh manusia
    # yang memeriksa header maupun oleh mesin pengindeks.
    add_header X-Environment "staging" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    ssl_certificate /etc/letsencrypt/live/staging.rsa-pss.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.rsa-pss.com/privkey.pem; # managed by Certbot
}
