<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="760"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Wireframe Scanner Workspace</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Rancangan workspace verifikasi QR tunggal dan massal</tspan></text>
<rect x="90" y="105" width="1100" height="80" class="soft"/>
<text x="640" y="137" text-anchor="middle" class="label"><tspan x="640" dy="0">Verifikasi QR Code</tspan></text>
<text x="640" y="162" text-anchor="middle" class="small"><tspan x="640" dy="0">[Home]     Verifikasi keaslian dan integritas QR Code</tspan></text>
<rect x="90" y="215" width="1100" height="55" class="gray"/>
<text x="290" y="250" text-anchor="middle" class="label"><tspan x="290" dy="0">Tab: Verifikasi Tunggal</tspan></text>
<text x="590" y="250" text-anchor="middle" class="label"><tspan x="590" dy="0">Tab: Verifikasi Massal</tspan></text>
<rect x="110" y="310" width="670" height="190" class="box"/>
<text x="445.0" y="340" text-anchor="middle" class="label"><tspan x="445.0" dy="0">Upload Area</tspan></text>
<text x="445.0" y="366" text-anchor="middle" class="small"><tspan x="445.0" dy="0">drag &amp; drop file QR</tspan><tspan x="445.0" dy="18">pilih file</tspan><tspan x="445.0" dy="18">format PNG/JPG</tspan></text>
<rect x="830" y="310" width="330" height="190" class="orange"/>
<text x="995.0" y="340" text-anchor="middle" class="label"><tspan x="995.0" dy="0">Action Panel</tspan></text>
<text x="995.0" y="366" text-anchor="middle" class="small"><tspan x="995.0" dy="0">[Verifikasi QR]</tspan><tspan x="995.0" dy="18">[Pilih File]</tspan><tspan x="995.0" dy="18">info validasi</tspan></text>
<rect x="110" y="550" width="1050" height="140" class="green"/>
<text x="635.0" y="580" text-anchor="middle" class="label"><tspan x="635.0" dy="0">Result Card</tspan></text>
<text x="635.0" y="606" text-anchor="middle" class="small"><tspan x="635.0" dy="0">badge status: valid / replay / data palsu</tspan><tspan x="635.0" dy="18">data QR + timing + signature</tspan><tspan x="635.0" dy="18">shortcut scanner HP / USB / log / dashboard</tspan></text>
</svg>