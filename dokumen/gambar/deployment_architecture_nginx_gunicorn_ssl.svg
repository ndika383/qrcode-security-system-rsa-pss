<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="780"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Arsitektur Deployment Produksi</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Nginx sebagai reverse proxy + SSL/TLS, Gunicorn sebagai WSGI server, Flask sebagai aplikasi</tspan></text>
<rect x="60" y="150" width="190" height="90" class="soft"/>
<text x="155.0" y="180" text-anchor="middle" class="label"><tspan x="155.0" dy="0">Client</tspan></text>
<text x="155.0" y="206" text-anchor="middle" class="small"><tspan x="155.0" dy="0">Browser desktop</tspan><tspan x="155.0" dy="18">Kamera HP / scanner</tspan></text>
<rect x="330" y="150" width="210" height="90" class="gray"/>
<text x="435.0" y="180" text-anchor="middle" class="label"><tspan x="435.0" dy="0">DNS</tspan></text>
<text x="435.0" y="206" text-anchor="middle" class="small"><tspan x="435.0" dy="0">rsa-pss.com</tspan><tspan x="435.0" dy="18">A record -&gt; IP server</tspan></text>
<rect x="620" y="120" width="230" height="120" class="green"/>
<text x="735.0" y="150" text-anchor="middle" class="label"><tspan x="735.0" dy="0">Nginx</tspan></text>
<text x="735.0" y="176" text-anchor="middle" class="small"><tspan x="735.0" dy="0">reverse proxy</tspan><tspan x="735.0" dy="18">SSL/TLS termination</tspan><tspan x="735.0" dy="18">upload limit 500M</tspan></text>
<rect x="940" y="150" width="230" height="90" class="orange"/>
<text x="1055.0" y="180" text-anchor="middle" class="label"><tspan x="1055.0" dy="0">Gunicorn WSGI</tspan></text>
<text x="1055.0" y="206" text-anchor="middle" class="small"><tspan x="1055.0" dy="0">127.0.0.1:5000</tspan><tspan x="1055.0" dy="18">wsgi:app</tspan></text>
<rect x="940" y="330" width="230" height="90" class="soft"/>
<text x="1055.0" y="360" text-anchor="middle" class="label"><tspan x="1055.0" dy="0">Flask App</tspan></text>
<text x="1055.0" y="386" text-anchor="middle" class="small"><tspan x="1055.0" dy="0">routes/templates</tspan><tspan x="1055.0" dy="18">crypto + QR logic</tspan></text>
<rect x="620" y="500" width="230" height="90" class="yellow"/>
<text x="735.0" y="530" text-anchor="middle" class="label"><tspan x="735.0" dy="0">Local Storage</tspan></text>
<text x="735.0" y="556" text-anchor="middle" class="small"><tspan x="735.0" dy="0">PNG / JSON / CSV</tspan><tspan x="735.0" dy="18">SQLite nonce_state</tspan></text>
<rect x="300" y="500" width="230" height="90" class="gray"/>
<text x="415.0" y="530" text-anchor="middle" class="label"><tspan x="415.0" dy="0">systemd</tspan></text>
<text x="415.0" y="556" text-anchor="middle" class="small"><tspan x="415.0" dy="0">qrcode.service</tspan><tspan x="415.0" dy="18">restart + journal</tspan></text>
<rect x="60" y="500" width="190" height="90" class="green"/>
<text x="155.0" y="530" text-anchor="middle" class="label"><tspan x="155.0" dy="0">Certbot</tspan></text>
<text x="155.0" y="556" text-anchor="middle" class="small"><tspan x="155.0" dy="0">Let&#x27;s Encrypt</tspan><tspan x="155.0" dy="18">renewal otomatis</tspan></text>
<path d="M250 195 L330 195" class="flow"/>
<path d="M540 195 L620 180" class="flow"/>
<path d="M850 180 L940 195" class="flow"/>
<path d="M1055 240 L1055 330" class="flow"/>
<path d="M1055 420 L735 500" class="flow"/>
<path d="M415 500 L940 195" class="flow"/>
<path d="M155 500 L620 180" class="flow"/>
<rect x="220" y="660" width="840" height="70" class="gray"/>
<text x="640" y="690" text-anchor="middle" class="label"><tspan x="640" dy="0">Publik hanya membuka HTTP/HTTPS ke Nginx. Gunicorn tetap bind lokal 127.0.0.1.</tspan></text>
</svg>