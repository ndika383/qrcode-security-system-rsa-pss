<rect x="860" y="390" width="160" height="70" class="green"/>
<text x="940.0" y="420" text-anchor="middle" class="label"><tspan x="940.0" dy="0">Nonce SQLite</tspan></text>
<rect x="1070" y="390" width="160" height="70" class="green"/>
<text x="1150.0" y="420" text-anchor="middle" class="label"><tspan x="1150.0" dy="0">Verify Log CSV</tspan></text>
<path d="M525 390 L560 280" class="flow"/>
<path d="M730 390 L765 280" class="flow"/>
<path d="M940 390 L970 280" class="flow"/>
<path d="M1150 390 L1115 280" class="flow"/>
</svg>