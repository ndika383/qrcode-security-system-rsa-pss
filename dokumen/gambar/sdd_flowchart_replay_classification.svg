<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="650"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Flowchart Klasifikasi Replay dan Data Palsu</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Aturan keputusan agar data palsu tidak keliru menjadi replay</tspan></text>
<rect x="60" y="210" width="190" height="80" class="soft"/>
<text x="155.0" y="240" text-anchor="middle" class="label"><tspan x="155.0" dy="0">Payload + Signature</tspan></text>
<polygon points="360,205.0 450.0,250 360,295.0 270.0,250" class="yellow"/>
<text x="360" y="246" text-anchor="middle" class="label"><tspan x="360" dy="0">Original</tspan><tspan x="360" dy="18">ditemukan?</tspan></text>
<polygon points="610,205.0 700.0,250 610,295.0 520.0,250" class="yellow"/>
<text x="610" y="246" text-anchor="middle" class="label"><tspan x="610" dy="0">Exact</tspan><tspan x="610" dy="18">match?</tspan></text>
<polygon points="860,205.0 950.0,250 860,295.0 770.0,250" class="yellow"/>
<text x="860" y="246" text-anchor="middle" class="label"><tspan x="860" dy="0">Signature</tspan><tspan x="860" dy="18">valid?</tspan></text>
<polygon points="1110,205.0 1200.0,250 1110,295.0 1020.0,250" class="yellow"/>
<text x="1110" y="246" text-anchor="middle" class="label"><tspan x="1110" dy="0">Nonce</tspan><tspan x="1110" dy="18">used?</tspan></text>
<rect x="260" y="430" width="190" height="75" class="red"/>
<text x="355.0" y="460" text-anchor="middle" class="label"><tspan x="355.0" dy="0">Data Palsu</tspan></text>
<rect x="520" y="430" width="190" height="75" class="red"/>
<text x="615.0" y="460" text-anchor="middle" class="label"><tspan x="615.0" dy="0">Data Dimodifikasi</tspan></text>
<rect x="770" y="430" width="190" height="75" class="red"/>
<text x="865.0" y="460" text-anchor="middle" class="label"><tspan x="865.0" dy="0">Signature Invalid</tspan></text>
<rect x="1020" y="430" width="190" height="75" class="yellow"/>
<text x="1115.0" y="460" text-anchor="middle" class="label"><tspan x="1115.0" dy="0">Replay Attack</tspan></text>
<rect x="1020" y="90" width="190" height="75" class="green"/>
<text x="1115.0" y="120" text-anchor="middle" class="label"><tspan x="1115.0" dy="0">Valid Authentik</tspan></text>
<path d="M250 250 L270 250" class="flow"/>
<path d="M450 250 L520 250" class="flow"/>
<path d="M700 250 L770 250" class="flow"/>
<path d="M950 250 L1020 250" class="flow"/>
<path d="M1110 205 L1110 165" class="flow"/>
<path d="M1110 295 L1110 430" class="flow"/>
<path d="M860 295 L860 430" class="flow"/>
<path d="M610 295 L610 430" class="flow"/>
<path d="M360 295 L360 430" class="flow"/>
</svg>