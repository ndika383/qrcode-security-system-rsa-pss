  <path d="M610 620 L505 700" class="flow"/><text x="540" y="660" class="yesno">RSA</text>
  <path d="M690 635 L690 700" class="flow"/><text x="705" y="665" class="yesno">ECDSA</text>
  <path d="M575 575 C450 610 345 660 320 700" class="flow"/><text x="390" y="625" class="yesno">Lain</text>
  <path d="M505 760 L545 815" class="flow"/>
  <path d="M690 760 L625 815" class="flow"/>
  <path d="M320 760 C390 820 430 850 480 865" class="flow"/>
  <path d="M690 865 C770 820 830 390 905 345" class="flow"/>
  <path d="M585 925 C660 990 690 1010 730 1035" class="flow"/>
  <text x="710" y="840" class="yesno">hasil signature diteruskan</text>

  <path d="M1135 340 C1190 360 1220 385 1235 405" class="flow"/>
  <path d="M1020 372 L1020 405" class="flow"/>
  <path d="M915 465 C860 500 895 545 945 575" class="flow"/><text x="870" y="520" class="yesno">Tidak</text>
