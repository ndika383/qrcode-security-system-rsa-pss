  <path d="M1340 465 C1400 500 1405 545 1390 575" class="flow"/><text x="1380" y="520" class="yesno">Tidak</text>
  <path d="M1235 525 L1235 675" class="flow"/><text x="1250" y="610" class="yesno">Ya + signature valid</text>
  <path d="M1185 525 C1160 545 1160 560 1160 575" class="flow"/><text x="1110" y="548" class="yesno">signature invalid</text>
  <path d="M1130 735 C1090 770 1120 805 1160 830" class="flow"/><text x="1095" y="780" class="yesno">Tidak</text>
  <path d="M1340 735 C1390 760 1400 800 1400 830" class="flow"/><text x="1370" y="780" class="yesno">Ya</text>
  <path d="M1400 894 L1400 930" class="flow"/>
  <path d="M1300 990 C1220 1015 1220 1060 1275 1100" class="flow"/><text x="1235" y="1035" class="yesno">Tidak</text>
  <path d="M1500 990 C1540 1025 1535 1070 1485 1100" class="flow"/><text x="1515" y="1035" class="yesno">Ya</text>

  <path d="M215 678 C340 940 500 1040 625 1060" class="flow"/>
