<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="760"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Roadmap ISO/IEC 20248:2022 Alignment</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Peta gap dari implementasi saat ini menuju kepatuhan yang lebih kuat</tspan></text>
<rect x="80" y="180" width="240" height="150" class="soft"/>
<text x="200.0" y="210" text-anchor="middle" class="label"><tspan x="200.0" dy="0">Kondisi Saat Ini</tspan></text>
<text x="200.0" y="236" text-anchor="middle" class="small"><tspan x="200.0" dy="0">payload custom</tspan><tspan x="200.0" dy="18">RSA-PSS/ECDSA</tspan><tspan x="200.0" dy="18">nonce replay online</tspan></text>
<rect x="380" y="180" width="240" height="150" class="yellow"/>
<text x="500.0" y="210" text-anchor="middle" class="label"><tspan x="500.0" dy="0">Gap Kepatuhan</tspan></text>
<text x="500.0" y="236" text-anchor="middle" class="small"><tspan x="500.0" dy="0">belum DigSig resmi</tspan><tspan x="500.0" dy="18">belum X.509/PKI</tspan><tspan x="500.0" dy="18">offline verify belum penuh</tspan></text>
<rect x="680" y="180" width="240" height="150" class="orange"/>
<text x="800.0" y="210" text-anchor="middle" class="label"><tspan x="800.0" dy="0">Target Penguatan</tspan></text>
<text x="800.0" y="236" text-anchor="middle" class="small"><tspan x="800.0" dy="0">envelope DigSig</tspan><tspan x="800.0" dy="18">certificate chain</tspan><tspan x="800.0" dy="18">schema data carrier</tspan></text>
<rect x="980" y="180" width="240" height="150" class="green"/>
<text x="1100.0" y="210" text-anchor="middle" class="label"><tspan x="1100.0" dy="0">ISO Alignment</tspan></text>
<text x="1100.0" y="236" text-anchor="middle" class="small"><tspan x="1100.0" dy="0">offline integrity</tspan><tspan x="1100.0" dy="18">issuer trust</tspan><tspan x="1100.0" dy="18">interoperability</tspan></text>
<path d="M320 255 L380 255" class="flow"/>
<path d="M620 255 L680 255" class="flow"/>
<path d="M920 255 L980 255" class="flow"/>
<rect x="190" y="470" width="900" height="120" class="gray"/>
<text x="640" y="506" text-anchor="middle" class="label"><tspan x="640" dy="0">Status Pernyataan yang Aman</tspan></text>
<text x="640" y="536" text-anchor="middle" class="small"><tspan x="640" dy="0">Sistem sudah mengarah ke prinsip ISO/IEC 20248:2022, tetapi belum dapat diklaim fully compliant.</tspan><tspan x="640" dy="24">Klaim penuh membutuhkan DigSig envelope resmi, X.509/PKI, dan verifikasi offline penuh.</tspan></text>
</svg>