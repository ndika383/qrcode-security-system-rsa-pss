<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1320" height="720"/>
<text x="660.0" y="44" text-anchor="middle" class="title"><tspan x="660.0" dy="0">Alur Penggunaan Operator</tspan></text>
<text x="660.0" y="72" text-anchor="middle" class="subtitle"><tspan x="660.0" dy="0">Urutan penggunaan sistem dari login sampai pencatatan log verifikasi</tspan></text>
<rect x="45" y="220" width="155" height="100" class="soft"/>
<text x="122.5" y="250" text-anchor="middle" class="label"><tspan x="122.5" dy="0">Login</tspan></text>
<text x="122.5" y="276" text-anchor="middle" class="small"><tspan x="122.5" dy="0">masuk admin</tspan></text>
<path d="M200 270 L225 270" class="flow"/>
<rect x="225" y="220" width="155" height="100" class="soft"/>
<text x="302.5" y="250" text-anchor="middle" class="label"><tspan x="302.5" dy="0">Home</tspan></text>
<text x="302.5" y="276" text-anchor="middle" class="small"><tspan x="302.5" dy="0">pilih fitur</tspan></text>
<path d="M380 270 L405 270" class="flow"/>
<rect x="405" y="220" width="155" height="100" class="green"/>
<text x="482.5" y="250" text-anchor="middle" class="label"><tspan x="482.5" dy="0">Generate QR</tspan></text>
<text x="482.5" y="276" text-anchor="middle" class="small"><tspan x="482.5" dy="0">tunggal / CSV</tspan></text>
<path d="M560 270 L585 270" class="flow"/>
<rect x="585" y="220" width="155" height="100" class="green"/>
<text x="662.5" y="250" text-anchor="middle" class="label"><tspan x="662.5" dy="0">Verifikasi</tspan></text>
<text x="662.5" y="276" text-anchor="middle" class="small"><tspan x="662.5" dy="0">file / massal</tspan></text>
<path d="M740 270 L765 270" class="flow"/>
<rect x="765" y="220" width="155" height="100" class="green"/>
<text x="842.5" y="250" text-anchor="middle" class="label"><tspan x="842.5" dy="0">Scanner HP/USB</tspan></text>
<text x="842.5" y="276" text-anchor="middle" class="small"><tspan x="842.5" dy="0">scan langsung</tspan></text>
<path d="M920 270 L945 270" class="flow"/>
<rect x="945" y="220" width="155" height="100" class="soft"/>
<text x="1022.5" y="250" text-anchor="middle" class="label"><tspan x="1022.5" dy="0">Hasil</tspan></text>
<text x="1022.5" y="276" text-anchor="middle" class="small"><tspan x="1022.5" dy="0">valid / replay / palsu</tspan></text>
<path d="M1100 270 L1125 270" class="flow"/>
<rect x="1125" y="220" width="155" height="100" class="soft"/>
<text x="1202.5" y="250" text-anchor="middle" class="label"><tspan x="1202.5" dy="0">Log</tspan></text>
<text x="1202.5" y="276" text-anchor="middle" class="small"><tspan x="1202.5" dy="0">audit hasil</tspan></text>
<rect x="260" y="500" width="760" height="82" class="yellow"/>
<text x="640" y="532" text-anchor="middle" class="label"><tspan x="640" dy="0">Aturan operasional</tspan></text>
<text x="640" y="560" text-anchor="middle" class="small"><tspan x="640" dy="0">Scan pertama QR asli menghasilkan valid; scan ulang QR yang sama menghasilkan replay attack.</tspan></text>
</svg>