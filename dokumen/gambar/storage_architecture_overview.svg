<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="780"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Arsitektur Basis Data dan Log Storage</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Pemetaan storage hybrid pada QR Code Security System</tspan></text>
<rect x="500" y="130" width="280" height="95" class="orange"/>
<text x="640.0" y="160" text-anchor="middle" class="label"><tspan x="640.0" dy="0">Flask Application</tspan></text>
<text x="640.0" y="186" text-anchor="middle" class="small"><tspan x="640.0" dy="0">controller</tspan><tspan x="640.0" dy="18">crypto</tspan><tspan x="640.0" dy="18">QR processing</tspan></text>
<rect x="80" y="310" width="220" height="90" class="green"/>
<text x="190.0" y="340" text-anchor="middle" class="label"><tspan x="190.0" dy="0">SQLite Nonce State</tspan></text>
<text x="190.0" y="366" text-anchor="middle" class="small"><tspan x="190.0" dy="0">security_state.db</tspan><tspan x="190.0" dy="18">nonce_state</tspan></text>
<rect x="380" y="310" width="220" height="90" class="green"/>
<text x="490.0" y="340" text-anchor="middle" class="label"><tspan x="490.0" dy="0">CSV Event Logs</tspan></text>
<text x="490.0" y="366" text-anchor="middle" class="small"><tspan x="490.0" dy="0">generate</tspan><tspan x="490.0" dy="18">verifikasi</tspan><tspan x="490.0" dy="18">audit</tspan></text>
<rect x="680" y="310" width="220" height="90" class="soft"/>
<text x="790.0" y="340" text-anchor="middle" class="label"><tspan x="790.0" dy="0">JSON Task/Payload</tspan></text>
<text x="790.0" y="366" text-anchor="middle" class="small"><tspan x="790.0" dy="0">task_results</tspan><tspan x="790.0" dy="18">verify_payloads</tspan></text>
<rect x="980" y="310" width="220" height="90" class="soft"/>
<text x="1090.0" y="340" text-anchor="middle" class="label"><tspan x="1090.0" dy="0">PNG/File Storage</tspan></text>
<text x="1090.0" y="366" text-anchor="middle" class="small"><tspan x="1090.0" dy="0">qr</tspan><tspan x="1090.0" dy="18">uploads</tspan><tspan x="1090.0" dy="18">qr_massal</tspan></text>
<rect x="380" y="520" width="220" height="90" class="gray"/>
<text x="490.0" y="550" text-anchor="middle" class="label"><tspan x="490.0" dy="0">QR Stats JSON</tspan></text>
<text x="490.0" y="576" text-anchor="middle" class="small"><tspan x="490.0" dy="0">qr_stats.json</tspan><tspan x="490.0" dy="18">dashboard summary</tspan></text>
<rect x="680" y="520" width="220" height="90" class="gray"/>
<text x="790.0" y="550" text-anchor="middle" class="label"><tspan x="790.0" dy="0">Rotating App Log</tspan></text>
<text x="790.0" y="576" text-anchor="middle" class="small"><tspan x="790.0" dy="0">app.log</tspan><tspan x="790.0" dy="18">app.log.1-10</tspan></text>
<path d="M640 225 C640 270 190 270 190 310" class="flow"/>
<path d="M640 225 C640 270 490 270 490 310" class="flow"/>
<path d="M640 225 C640 270 790 270 790 310" class="flow"/>
<path d="M640 225 C640 270 1090 270 1090 310" class="flow"/>
<path d="M640 225 C640 270 490 270 490 310" class="flow"/>
<path d="M640 225 C640 270 790 270 790 310" class="flow"/>
<rect x="260" y="660" width="760" height="70" class="yellow"/>
<text x="640" y="690" text-anchor="middle" class="label"><tspan x="640" dy="0">Storage hybrid dipilih agar mudah dioperasikan, tetapi log produksi sebaiknya dimigrasikan ke SQLite/PostgreSQL.</tspan></text>
</svg>