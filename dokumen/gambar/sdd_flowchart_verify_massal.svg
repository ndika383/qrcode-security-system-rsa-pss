<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1360" height="620"/>
<text x="680.0" y="44" text-anchor="middle" class="title"><tspan x="680.0" dy="0">Flowchart Verifikasi Massal</tspan></text>
<text x="680.0" y="72" text-anchor="middle" class="subtitle"><tspan x="680.0" dy="0">Direct untuk batch kecil, async task untuk file banyak</tspan></text>
<rect x="80" y="220" width="145" height="90" class="soft"/>
<text x="152.5" y="250" text-anchor="middle" class="label"><tspan x="152.5" dy="0">Upload banyak file</tspan></text>
<path d="M225 265 L255 265" class="flow"/>
<rect x="255" y="220" width="145" height="90" class="soft"/>
<text x="327.5" y="250" text-anchor="middle" class="label"><tspan x="327.5" dy="0">Validasi file</tspan></text>
<path d="M400 265 L430 265" class="flow"/>
<rect x="430" y="220" width="145" height="90" class="yellow"/>
<text x="502.5" y="250" text-anchor="middle" class="label"><tspan x="502.5" dy="0">&gt;5 file?</tspan></text>
<path d="M575 265 L605 265" class="flow"/>
<rect x="605" y="220" width="145" height="90" class="soft"/>
<text x="677.5" y="250" text-anchor="middle" class="label"><tspan x="677.5" dy="0">Task async / direct</tspan></text>
<path d="M750 265 L780 265" class="flow"/>
<rect x="780" y="220" width="145" height="90" class="soft"/>
<text x="852.5" y="250" text-anchor="middle" class="label"><tspan x="852.5" dy="0">Loop verifikasi 2-lapis</tspan></text>
<path d="M925 265 L955 265" class="flow"/>
<rect x="955" y="220" width="145" height="90" class="soft"/>
<text x="1027.5" y="250" text-anchor="middle" class="label"><tspan x="1027.5" dy="0">Ringkasan hasil</tspan></text>
<path d="M1100 265 L1130 265" class="flow"/>
<rect x="1130" y="220" width="145" height="90" class="soft"/>
<text x="1202.5" y="250" text-anchor="middle" class="label"><tspan x="1202.5" dy="0">Log per file</tspan></text>
</svg>