<text x="640.0" y="610" text-anchor="middle" class="label"><tspan x="640.0" dy="0">Analisis Waktu + File + Performa</tspan></text>
<text x="640.0" y="636" text-anchor="middle" class="small"><tspan x="640.0" dy="0">generate vs verify</tspan><tspan x="640.0" dy="18">statistik file</tspan><tspan x="640.0" dy="18">grade dan metodologi</tspan></text>
</svg>