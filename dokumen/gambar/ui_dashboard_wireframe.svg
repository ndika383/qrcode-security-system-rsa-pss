<text x="497.5" y="286" text-anchor="middle" class="small"><tspan x="497.5" dy="0">angka utama</tspan><tspan x="497.5" dy="18">badge/progress</tspan></text>
<rect x="660" y="230" width="245" height="95" class="green"/>
<text x="782.5" y="260" text-anchor="middle" class="label"><tspan x="782.5" dy="0">Median Generate</tspan></text>
<text x="782.5" y="286" text-anchor="middle" class="small"><tspan x="782.5" dy="0">angka utama</tspan><tspan x="782.5" dy="18">badge/progress</tspan></text>
<rect x="945" y="230" width="245" height="95" class="green"/>
