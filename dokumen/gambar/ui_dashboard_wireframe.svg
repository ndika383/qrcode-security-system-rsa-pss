<rect x="90" y="370" width="690" height="170" class="box"/>
<text x="435.0" y="400" text-anchor="middle" class="label"><tspan x="435.0" dy="0">Performa Generate QR</tspan></text>
<text x="435.0" y="426" text-anchor="middle" class="small"><tspan x="435.0" dy="0">Total QR</tspan><tspan x="435.0" dy="18">QR/detik</tspan><tspan x="435.0" dy="18">KB/QR</tspan></text>
