<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="740"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Alur Setup SSL/TLS dengan Certbot</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Dari DNS dan Nginx HTTP menuju sertifikat HTTPS dan renewal otomatis</tspan></text>
<rect x="80" y="160" width="210" height="90" class="soft"/>
<text x="185.0" y="190" text-anchor="middle" class="label"><tspan x="185.0" dy="0">DNS Ready</tspan></text>
<text x="185.0" y="216" text-anchor="middle" class="small"><tspan x="185.0" dy="0">A record</tspan><tspan x="185.0" dy="18">domain -&gt; server</tspan></text>
<rect x="360" y="160" width="210" height="90" class="green"/>
<text x="465.0" y="190" text-anchor="middle" class="label"><tspan x="465.0" dy="0">Nginx HTTP</tspan></text>
<text x="465.0" y="216" text-anchor="middle" class="small"><tspan x="465.0" dy="0">port 80</tspan><tspan x="465.0" dy="18">server_name valid</tspan></text>
<rect x="640" y="160" width="210" height="90" class="orange"/>
<text x="745.0" y="190" text-anchor="middle" class="label"><tspan x="745.0" dy="0">Certbot</tspan></text>
<text x="745.0" y="216" text-anchor="middle" class="small"><tspan x="745.0" dy="0">--nginx</tspan><tspan x="745.0" dy="18">request cert</tspan></text>
<rect x="920" y="160" width="210" height="90" class="green"/>
<text x="1025.0" y="190" text-anchor="middle" class="label"><tspan x="1025.0" dy="0">Let&#x27;s Encrypt</tspan></text>
<text x="1025.0" y="216" text-anchor="middle" class="small"><tspan x="1025.0" dy="0">validasi domain</tspan><tspan x="1025.0" dy="18">issue certificate</tspan></text>
<rect x="640" y="380" width="210" height="90" class="green"/>
<text x="745.0" y="410" text-anchor="middle" class="label"><tspan x="745.0" dy="0">Nginx HTTPS</tspan></text>
<text x="745.0" y="436" text-anchor="middle" class="small"><tspan x="745.0" dy="0">port 443</tspan><tspan x="745.0" dy="18">redirect HTTP</tspan></text>
<rect x="920" y="380" width="210" height="90" class="gray"/>
<text x="1025.0" y="410" text-anchor="middle" class="label"><tspan x="1025.0" dy="0">Auto Renewal</tspan></text>
<text x="1025.0" y="436" text-anchor="middle" class="small"><tspan x="1025.0" dy="0">certbot timer</tspan><tspan x="1025.0" dy="18">renewal test</tspan></text>
<path d="M290 205 L360 205" class="flow"/>
<path d="M570 205 L640 205" class="flow"/>
<path d="M850 205 L920 205" class="flow"/>
<path d="M1025 250 C1025 320 790 340 745 380" class="flow"/>
<path d="M850 425 L920 425" class="flow"/>
<rect x="260" y="590" width="760" height="70" class="yellow"/>
<text x="640" y="620" text-anchor="middle" class="label"><tspan x="640" dy="0">Setelah SSL aktif: BASE_URL=https://rsa-pss.com/, REQUIRE_HTTPS=True, TRUST_PROXY_HEADERS=True.</tspan></text>
</svg>