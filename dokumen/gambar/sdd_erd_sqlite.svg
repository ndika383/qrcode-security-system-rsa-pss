<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="680"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">ERD Fisik SQLite Saat Ini</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Tabel security_state.db yang dipakai untuk replay-state nonce</tspan></text>
<rect x="220" y="180" width="300" height="210" class="orange"/>
<text x="370.0" y="210" text-anchor="middle" class="label"><tspan x="370.0" dy="0">nonce_state</tspan></text>
<text x="370.0" y="236" text-anchor="middle" class="small"><tspan x="370.0" dy="0">PK nonce</tspan><tspan x="370.0" dy="18">first_used_at</tspan><tspan x="370.0" dy="18">last_used_at</tspan><tspan x="370.0" dy="18">usage_count</tspan></text>
<rect x="760" y="180" width="300" height="170" class="orange"/>
<text x="910.0" y="210" text-anchor="middle" class="label"><tspan x="910.0" dy="0">security_metadata</tspan></text>
<text x="910.0" y="236" text-anchor="middle" class="small"><tspan x="910.0" dy="0">PK key</tspan><tspan x="910.0" dy="18">value</tspan><tspan x="910.0" dy="18">updated_at</tspan></text>
<rect x="340" y="500" width="600" height="80" class="gray"/>
<text x="640" y="532" text-anchor="middle" class="label"><tspan x="640" dy="0">SQLite fisik saat ini hanya menyimpan state keamanan replay dan metadata migrasi.</tspan></text>
</svg>