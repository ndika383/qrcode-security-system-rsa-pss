<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="740"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Arsitektur High-Resolution Logging</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Alur timer detail dari proses generate/verifikasi menuju dashboard performa</tspan></text>
<rect x="70" y="150" width="220" height="95" class="soft"/>
<text x="180.0" y="180" text-anchor="middle" class="label"><tspan x="180.0" dy="0">Generate QR</tspan></text>
<text x="180.0" y="206" text-anchor="middle" class="small"><tspan x="180.0" dy="0">data</tspan><tspan x="180.0" dy="18">sign</tspan><tspan x="180.0" dy="18">qr</tspan><tspan x="180.0" dy="18">save</tspan></text>
<rect x="70" y="340" width="220" height="95" class="soft"/>
<text x="180.0" y="370" text-anchor="middle" class="label"><tspan x="180.0" dy="0">Verifikasi QR</tspan></text>
<text x="180.0" y="396" text-anchor="middle" class="small"><tspan x="180.0" dy="0">load</tspan><tspan x="180.0" dy="18">decode</tspan><tspan x="180.0" dy="18">verify</tspan><tspan x="180.0" dy="18">db</tspan></text>
<rect x="380" y="210" width="220" height="95" class="orange"/>
<text x="490.0" y="240" text-anchor="middle" class="label"><tspan x="490.0" dy="0">Timer</tspan></text>
<text x="490.0" y="266" text-anchor="middle" class="small"><tspan x="490.0" dy="0">time.perf_counter</tspan><tspan x="490.0" dy="18">6 decimal seconds</tspan></text>
<rect x="700" y="130" width="230" height="95" class="green"/>
<text x="815.0" y="160" text-anchor="middle" class="label"><tspan x="815.0" dy="0">CSV Generate Log</tspan></text>
<text x="815.0" y="186" text-anchor="middle" class="small"><tspan x="815.0" dy="0">subprocess timing</tspan><tspan x="815.0" dy="18">file size/dimensi</tspan></text>
<rect x="700" y="330" width="230" height="95" class="green"/>
<text x="815.0" y="360" text-anchor="middle" class="label"><tspan x="815.0" dy="0">CSV Verify Log</tspan></text>
<text x="815.0" y="386" text-anchor="middle" class="small"><tspan x="815.0" dy="0">status keamanan</tspan><tspan x="815.0" dy="18">load/decode/verify/db</tspan></text>
<rect x="1010" y="230" width="220" height="95" class="yellow"/>
<text x="1120.0" y="260" text-anchor="middle" class="label"><tspan x="1120.0" dy="0">Dashboard</tspan></text>
<text x="1120.0" y="286" text-anchor="middle" class="small"><tspan x="1120.0" dy="0">mean median</tspan><tspan x="1120.0" dy="18">p95 p99 grade</tspan></text>
<path d="M290 195 L380 245" class="flow"/>
<path d="M290 385 L380 265" class="flow"/>
<path d="M600 245 L700 175" class="flow"/>
<path d="M600 265 L700 375" class="flow"/>
<path d="M930 175 L1010 260" class="flow"/>
<path d="M930 375 L1010 290" class="flow"/>
<rect x="260" y="560" width="760" height="80" class="gray"/>
<text x="640" y="590" text-anchor="middle" class="label"><tspan x="640" dy="0">High-resolution logging mencatat durasi subproses, bukan hanya total waktu.</tspan></text>
<text x="640" y="615" text-anchor="middle" class="small"><tspan x="640" dy="0">Data ini dipakai untuk dashboard performa, p95/p99, outlier, dan evaluasi response time.</tspan></text>
</svg>