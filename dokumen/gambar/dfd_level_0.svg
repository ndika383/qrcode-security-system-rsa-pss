<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.actor{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}.store{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.process{fill:#fff7ed;stroke:#ea580c;stroke-width:4}.label{font:700 18px Arial,sans-serif;fill:#111827}.small{font:400 14px Arial,sans-serif;fill:#374151}.flow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.flowText{font:400 13px Arial,sans-serif;fill:#334155}.note{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:12}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="640" y="48" text-anchor="middle" class="title">DFD Level 0 - Context Diagram</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">QR Code Security System RSA-PSS</text>

  <rect x="70" y="150" width="220" height="110" class="actor"/>
  <text x="180" y="190" text-anchor="middle" class="label">Admin / Operator</text>
  <text x="180" y="218" text-anchor="middle" class="small">Generate QR</text>
  <text x="180" y="240" text-anchor="middle" class="small">Verifikasi dan monitoring</text>

  <rect x="70" y="330" width="220" height="110" class="actor"/>
  <text x="180" y="370" text-anchor="middle" class="label">Petugas Lapangan</text>
  <text x="180" y="398" text-anchor="middle" class="small">Scanner HP</text>
  <text x="180" y="420" text-anchor="middle" class="small">Scan QR di lapangan</text>

  <rect x="70" y="510" width="220" height="110" class="actor"/>
  <text x="180" y="550" text-anchor="middle" class="label">Auditor</text>
  <text x="180" y="578" text-anchor="middle" class="small">Membaca log</text>
  <text x="180" y="600" text-anchor="middle" class="small">Laporan dan audit</text>

  <circle cx="640" cy="385" r="150" class="process"/>
  <text x="640" y="352" text-anchor="middle" class="label">QR Code Security</text>
  <text x="640" y="380" text-anchor="middle" class="label">System</text>
  <text x="640" y="412" text-anchor="middle" class="small">Generate, verify, replay detection,</text>
  <text x="640" y="434" text-anchor="middle" class="small">dashboard, logging, audit</text>

  <rect x="985" y="315" width="230" height="140" class="store"/>
  <text x="1100" y="358" text-anchor="middle" class="label">Storage Lokal</text>
  <text x="1100" y="388" text-anchor="middle" class="small">PNG, JSON, CSV</text>
  <text x="1100" y="410" text-anchor="middle" class="small">SQLite nonce_state</text>
  <text x="1100" y="432" text-anchor="middle" class="small">App log dan task data</text>

  <path d="M290 205 C400 205 455 280 508 315" class="flow"/>
  <text x="390" y="190" class="flowText">data generate / file QR / aksi admin</text>
  <path d="M505 455 C450 500 390 565 290 565" class="flow"/>
  <text x="350" y="610" class="flowText">log, laporan, dashboard</text>

  <path d="M290 385 L490 385" class="flow"/>
  <text x="335" y="372" class="flowText">hasil scan kamera HP</text>
  <path d="M505 415 C420 460 370 450 290 430" class="flow"/>
  <text x="335" y="468" class="flowText">hasil valid / replay / palsu</text>

  <path d="M290 565 C420 525 472 485 505 445" class="flow"/>
  <text x="350" y="525" class="flowText">permintaan log dan laporan</text>

  <path d="M790 385 L985 385" class="flow"/>
  <path d="M985 420 C910 500 820 510 760 475" class="flow"/>
  <text x="838" y="365" class="flowText">baca / tulis data</text>
  <text x="820" y="535" class="flowText">QR, payload, nonce, log</text>

  <rect x="380" y="650" width="520" height="54" class="note"/>
  <text x="640" y="682" text-anchor="middle" class="small">Sistem menjadi pusat aliran data antara pengguna, proses keamanan QR, dan storage lokal.</text>
</svg>
