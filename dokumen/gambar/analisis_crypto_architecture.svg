<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="740"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Arsitektur Kebutuhan Bisnis dan Kriptograf</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Alur dari data bisnis sampai status verifikasi QR</tspan></text>
<rect x="70" y="150" width="190" height="90" class="soft"/>
<text x="165.0" y="180" text-anchor="middle" class="label"><tspan x="165.0" dy="0">Input Bisnis</tspan></text>
<text x="165.0" y="206" text-anchor="middle" class="small"><tspan x="165.0" dy="0">Nama</tspan><tspan x="165.0" dy="18">ID</tspan><tspan x="165.0" dy="18">kebutuhan validasi</tspan></text>
<rect x="310" y="150" width="190" height="90" class="box"/>
<text x="405.0" y="180" text-anchor="middle" class="label"><tspan x="405.0" dy="0">Data QR</tspan></text>
<text x="405.0" y="206" text-anchor="middle" class="small"><tspan x="405.0" dy="0">timestamp</tspan><tspan x="405.0" dy="18">nonce</tspan><tspan x="405.0" dy="18">qr metadata</tspan></text>
<rect x="550" y="150" width="190" height="90" class="box"/>
<text x="645.0" y="180" text-anchor="middle" class="label"><tspan x="645.0" dy="0">Canonical JSON</tspan></text>
<text x="645.0" y="206" text-anchor="middle" class="small"><tspan x="645.0" dy="0">sort_keys=True</tspan><tspan x="645.0" dy="18">format stabil</tspan></text>
<rect x="790" y="150" width="190" height="90" class="box"/>
<text x="885.0" y="180" text-anchor="middle" class="label"><tspan x="885.0" dy="0">Hash SHA-256</tspan></text>
<text x="885.0" y="206" text-anchor="middle" class="small"><tspan x="885.0" dy="0">digest data</tspan></text>
<rect x="1030" y="150" width="190" height="90" class="orange"/>
<text x="1125.0" y="180" text-anchor="middle" class="label"><tspan x="1125.0" dy="0">Digital Signature</tspan></text>
<text x="1125.0" y="206" text-anchor="middle" class="small"><tspan x="1125.0" dy="0">RSA-PSS / ECDSA</tspan><tspan x="1125.0" dy="18">private key</tspan></text>
<rect x="1030" y="360" width="190" height="90" class="green"/>
<text x="1125.0" y="390" text-anchor="middle" class="label"><tspan x="1125.0" dy="0">Payload QR</tspan></text>
<text x="1125.0" y="416" text-anchor="middle" class="small"><tspan x="1125.0" dy="0">data + signature</tspan><tspan x="1125.0" dy="18">metadata alg</tspan></text>
<rect x="790" y="360" width="190" height="90" class="green"/>
<text x="885.0" y="390" text-anchor="middle" class="label"><tspan x="885.0" dy="0">QR Code</tspan></text>
<text x="885.0" y="416" text-anchor="middle" class="small"><tspan x="885.0" dy="0">PNG / URL pendek</tspan><tspan x="885.0" dy="18">/v/&lt;token&gt;</tspan></text>
<rect x="550" y="360" width="190" height="90" class="soft"/>
<text x="645.0" y="390" text-anchor="middle" class="label"><tspan x="645.0" dy="0">Verifikasi Lapis 1</tspan></text>
<text x="645.0" y="416" text-anchor="middle" class="small"><tspan x="645.0" dy="0">verify signature</tspan><tspan x="645.0" dy="18">integritas</tspan></text>
<rect x="310" y="360" width="190" height="90" class="orange"/>
<text x="405.0" y="390" text-anchor="middle" class="label"><tspan x="405.0" dy="0">Verifikasi Lapis 2</tspan></text>
<text x="405.0" y="416" text-anchor="middle" class="small"><tspan x="405.0" dy="0">original data</tspan><tspan x="405.0" dy="18">nonce replay</tspan></text>
<rect x="70" y="360" width="190" height="90" class="pink"/>
<text x="165.0" y="390" text-anchor="middle" class="label"><tspan x="165.0" dy="0">Status Akhir</tspan></text>
<text x="165.0" y="416" text-anchor="middle" class="small"><tspan x="165.0" dy="0">valid / replay</tspan><tspan x="165.0" dy="18">data palsu</tspan></text>
<path d="M260 195 L310 195" class="flow"/>
<path d="M500 195 L550 195" class="flow"/>
<path d="M740 195 L790 195" class="flow"/>
<path d="M980 195 L1030 195" class="flow"/>
<path d="M1125 240 L1125 360" class="flow"/>
<path d="M1030 405 L980 405" class="flow"/>
<path d="M790 405 L740 405" class="flow"/>
<path d="M550 405 L500 405" class="flow"/>
<path d="M310 405 L260 405" class="flow"/>
<rect x="285" y="560" width="710" height="110" class="gray"/>
<text x="640" y="594" text-anchor="middle" class="label"><tspan x="640" dy="0">Makna desain kriptograf</tspan></text>
<text x="640" y="624" text-anchor="middle" class="small"><tspan x="640" dy="0">Signature membuktikan autentisitas dan integritas.</tspan><tspan x="640" dy="20">Nonce state membuktikan QR belum pernah dipakai ulang.</tspan></text>
</svg>