<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="650"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Flowchart Generate QR Tunggal</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Urutan proses dari input bisnis sampai QR tersimpan</tspan></text>
<rect x="40" y="220" width="135" height="95" class="soft"/>
<text x="107.5" y="250" text-anchor="middle" class="label"><tspan x="107.5" dy="0">1. Input nama/ID</tspan></text>
<path d="M175 267 L200 267" class="flow"/>
<rect x="195" y="220" width="135" height="95" class="soft"/>
<text x="262.5" y="250" text-anchor="middle" class="label"><tspan x="262.5" dy="0">2. Bentuk data + nonce</tspan></text>
<path d="M330 267 L355 267" class="flow"/>
<rect x="350" y="220" width="135" height="95" class="soft"/>
<text x="417.5" y="250" text-anchor="middle" class="label"><tspan x="417.5" dy="0">3. Canonical JSON</tspan></text>
<path d="M485 267 L510 267" class="flow"/>
<rect x="505" y="220" width="135" height="95" class="soft"/>
<text x="572.5" y="250" text-anchor="middle" class="label"><tspan x="572.5" dy="0">4. SHA-256</tspan></text>
<path d="M640 267 L665 267" class="flow"/>
<rect x="660" y="220" width="135" height="95" class="soft"/>
<text x="727.5" y="250" text-anchor="middle" class="label"><tspan x="727.5" dy="0">5. Sign RSA/ECDSA</tspan></text>
<path d="M795 267 L820 267" class="flow"/>
<rect x="815" y="220" width="135" height="95" class="green"/>
<text x="882.5" y="250" text-anchor="middle" class="label"><tspan x="882.5" dy="0">6. Buat payload URL</tspan></text>
<path d="M950 267 L975 267" class="flow"/>
<rect x="970" y="220" width="135" height="95" class="green"/>
<text x="1037.5" y="250" text-anchor="middle" class="label"><tspan x="1037.5" dy="0">7. Render QR PNG</tspan></text>
<path d="M1105 267 L1130 267" class="flow"/>
<rect x="1125" y="220" width="135" height="95" class="green"/>
<text x="1192.5" y="250" text-anchor="middle" class="label"><tspan x="1192.5" dy="0">8. Simpan + log</tspan></text>
<rect x="260" y="470" width="760" height="80" class="orange"/>
<text x="640" y="503" text-anchor="middle" class="label"><tspan x="640" dy="0">Output: QR PNG, JSON original, payload token, log_generate.csv, dan statistik dashboard.</tspan></text>
</svg>