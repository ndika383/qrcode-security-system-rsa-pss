<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
<style>
.bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}
.box{fill:#fff;stroke:#2563eb;stroke-width:3;rx:14}.soft{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:14}
.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:14}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:14}
.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:3;rx:14}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3;rx:14}
.yellow{fill:#fef9c3;stroke:#ca8a04;stroke-width:3;rx:14}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:3;rx:14}
.phone{fill:#111827;stroke:#020617;stroke-width:3;rx:34}.screen{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:24}
.label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#475569}
.flow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
.lane{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:18;opacity:.55}.lane2{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:18;opacity:.55}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect class="bg" width="1280" height="760"/>
<text x="640.0" y="44" text-anchor="middle" class="title"><tspan x="640.0" dy="0">Skema File-Locking dan Atomic Nonce Usage</tspan></text>
<text x="640.0" y="72" text-anchor="middle" class="subtitle"><tspan x="640.0" dy="0">Desain replay-state utama memakai SQLite, file-lock menjadi fallback/backup</tspan></text>
<rect x="80" y="140" width="210" height="80" class="soft"/>
<text x="185.0" y="170" text-anchor="middle" class="label"><tspan x="185.0" dy="0">Request A</tspan></text>
<text x="185.0" y="196" text-anchor="middle" class="small"><tspan x="185.0" dy="0">scan QR</tspan><tspan x="185.0" dy="18">nonce N</tspan></text>
<rect x="80" y="360" width="210" height="80" class="soft"/>
<text x="185.0" y="390" text-anchor="middle" class="label"><tspan x="185.0" dy="0">Request B</tspan></text>
<text x="185.0" y="416" text-anchor="middle" class="small"><tspan x="185.0" dy="0">scan QR sama</tspan><tspan x="185.0" dy="18">nonce N</tspan></text>
<rect x="380" y="140" width="240" height="80" class="green"/>
<text x="500.0" y="170" text-anchor="middle" class="label"><tspan x="500.0" dy="0">SQLite Atomic Upsert</tspan></text>
<text x="500.0" y="196" text-anchor="middle" class="small"><tspan x="500.0" dy="0">INSERT ON CONFLICT</tspan><tspan x="500.0" dy="18">usage_count + 1</tspan></text>
<rect x="700" y="140" width="210" height="80" class="yellow"/>
<text x="805.0" y="170" text-anchor="middle" class="label"><tspan x="805.0" dy="0">Usage Count</tspan></text>
<text x="805.0" y="196" text-anchor="middle" class="small"><tspan x="805.0" dy="0">1 = valid</tspan><tspan x="805.0" dy="18">&gt;1 = replay</tspan></text>
<rect x="380" y="360" width="240" height="80" class="orange"/>
<text x="500.0" y="390" text-anchor="middle" class="label"><tspan x="500.0" dy="0">File Lock Fallback</tspan></text>
<text x="500.0" y="416" text-anchor="middle" class="small"><tspan x="500.0" dy="0">used_nonces.txt.lock</tspan><tspan x="500.0" dy="18">exclusive create</tspan></text>
<rect x="700" y="360" width="210" height="80" class="gray"/>
<text x="805.0" y="390" text-anchor="middle" class="label"><tspan x="805.0" dy="0">Backup Append</tspan></text>
<text x="805.0" y="416" text-anchor="middle" class="small"><tspan x="805.0" dy="0">used_nonces.txt</tspan><tspan x="805.0" dy="18">audit fallback</tspan></text>
<path d="M290 180 L380 180" class="flow"/>
<path d="M620 180 L700 180" class="flow"/>
<path d="M290 400 L380 400" class="flow"/>
<path d="M620 400 L700 400" class="flow"/>
<rect x="250" y="570" width="780" height="90" class="red"/>
<text x="640" y="604" text-anchor="middle" class="label"><tspan x="640" dy="0">Catatan Risiko</tspan></text>
<text x="640" y="632" text-anchor="middle" class="small"><tspan x="640" dy="0">File lock belum memiliki stale-lock recovery berbasis PID/timestamp, sehingga perlu diperkuat untuk produksi multi-worker.</tspan></text>
</svg>