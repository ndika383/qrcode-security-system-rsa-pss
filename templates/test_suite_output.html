<!DOCTYPE html>
<html>
<head>
    <title>Realistic Data Generator Test Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .console-output {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Realistic Data Generator Test Suite</h2>
            <a href="{{ url_for('testing.testing_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
        
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Execution Output</h5>
                <span class="badge bg-success">Completed</span>
            </div>
            <div class="card-body p-0">
                <div class="console-output">{{ output }}</div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/table_keyboard_scroll.js') }}"></script>
</body>
</html>
