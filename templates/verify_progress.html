<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Verifikasi Massal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .progress { height: 25px; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-tasks me-2"></i>Verifikasi QR Code Massal</h4>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Memproses File...</h5>
                        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                            <p class="text-muted mb-0">Task ID: <span class="font-monospace">{{ task_id }}</span></p>
                            <button type="button" id="stopVerifyBtn" class="btn btn-outline-danger">
                                <i class="fas fa-stop-circle me-2"></i>Stop Verifikasi
                            </button>
                        </div>
                        
                        <div class="progress mb-3">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%">0%</div>
                        </div>
                        
                        <p id="statusText" class="text-center">Menunggu proses...</p>
                        
                        <div id="resultArea" class="text-center mt-4" style="display: none;">
                            <a href="{{ url_for('render_verify_massal_results') }}?task_id={{ task_id }}" class="btn btn-success">
                                <i class="fas fa-check-circle me-2"></i>Lihat Hasil Verifikasi
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const taskId = "{{ task_id }}";
        const statusUrl = `/api/verify_massal_progress_status?task_id=${taskId}`; 
        const stopUrl = `/api/stop_verify_massal_process?task_id=${taskId}`;
        let progressTimer = null;
        let stopRequested = false;

        function scheduleProgress(delay = 1000) {
            progressTimer = setTimeout(updateProgress, delay);
        }

        function setStopButtonState(disabled, text, loading = false) {
            const button = document.getElementById('stopVerifyBtn');
            if (!button) return;
            button.disabled = disabled;
            const icon = loading
                ? '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>'
                : '<i class="fas fa-stop-circle me-2"></i>';
            button.innerHTML = `${icon}${text}`;
        }

        function updateProgress() {
            fetch(statusUrl)
                .then(response => response.json())
                .then(data => {
                    let percent = data.percentage || 0;
                    
                    const progressBar = document.getElementById('progressBar');
                    progressBar.style.width = percent + '%';
                    progressBar.innerText = Math.round(percent) + '%';
                    document.getElementById('statusText').innerText = data.status || `Memproses...`;

                    if (data.is_stopped && !data.is_complete) {
                        stopRequested = true;
                        setStopButtonState(true, 'Menghentikan...', true);
                    }

                    if (data.is_complete) {
                        progressBar.classList.remove('progress-bar-animated');
                        progressBar.classList.add(data.is_stopped ? 'bg-warning' : 'bg-success');
                        document.getElementById('statusText').innerText = data.status || (data.is_stopped ? 'Proses dihentikan' : 'Selesai!');
                        document.getElementById('resultArea').style.display = 'block';
                        setStopButtonState(true, data.is_stopped ? 'Dihentikan' : 'Selesai');
                        
                        const resultLink = document.querySelector('#resultArea a');
                        if(resultLink) resultLink.href = `/view_verify_massal_results?task_id=${taskId}`;
                        
                    } else if (data.error) {
                        progressBar.classList.remove('progress-bar-animated');
                        progressBar.classList.add('bg-danger');
                        document.getElementById('statusText').innerText = 'Gagal: ' + (data.error || 'Terjadi kesalahan');
                        setStopButtonState(true, 'Tidak Aktif');
                    } else {
                        scheduleProgress(1000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    scheduleProgress(2000);
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const stopButton = document.getElementById('stopVerifyBtn');
            if (stopButton) {
                stopButton.addEventListener('click', function() {
                    if (stopRequested) return;
                    const confirmed = window.confirm('Hentikan proses verifikasi massal sekarang?');
                    if (!confirmed) return;

                    stopRequested = true;
                    setStopButtonState(true, 'Menghentikan...', true);

                    fetch(stopUrl, { method: 'POST' })
                        .then(response => response.json())
                        .then(data => {
                            if (!data.success && data.error) {
                                stopRequested = false;
                                setStopButtonState(false, 'Stop Verifikasi');
                                document.getElementById('statusText').innerText = data.error;
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            stopRequested = false;
                            setStopButtonState(false, 'Stop Verifikasi');
                        });
                });
            }

            updateProgress();
        });

        window.addEventListener('beforeunload', function() {
            if (progressTimer) clearTimeout(progressTimer);
        });
    </script>
    <script src="{{ url_for('static', filename='js/table_keyboard_scroll.js') }}"></script>
</body>
</html>
